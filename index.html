 r<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyda AI — ComfyUI'ı temelden öğrenin</title>

<meta property="og:description" content="ComfyUI'ı ezber değil mantık üzerinden anlatan Türkçe kanal.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  /* ---- Lyda AI marka paleti ---- */
  --siyah:  #0A0A0A;
  --beyaz:  #FFFFFF;
  --kirmizi:#E8332C;
  --gri:    #2B2B2B;
  --acikgri:#8F8F8F;

  /* Arka plandaki görsellerin ne kadar görüneceği.
     Yükseltirsen görseller belirginleşir ama metin okunaksızlaşır. */
  --fon-perde:.76;
}

*{box-sizing:border-box;margin:0;padding:0}
  /* Metin imleci yerine ok; linklerde el */
a,button{cursor:pointer}

body{
  background:var(--siyah);
  color:var(--beyaz);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
    cursor:default;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:clamp(2.5rem,8vw,5rem) 1.5rem 3rem;
}

/* ---------- Akan görsel duvarı ---------- */
.fon{
  position:fixed;inset:0;
  z-index:0;
  overflow:hidden;
  display:flex;
  justify-content:center;
  gap:14px;
  pointer-events:none;
  mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);
}

.sutun{
  display:flex;
  flex-direction:column;
  gap:14px;
  width:clamp(170px,25vw,290px);
  flex-shrink:0;
  animation:akisYukari 70s linear infinite;
}

.sutun.ters{animation-name:akisAsagi;animation-duration:88s}
.sutun:nth-child(3){animation-duration:78s}

.sutun img{
  width:100%;
  display:block;
  border-radius:6px;
  background:var(--gri);
}

/* Görsellerin üstündeki karartma perdesi — metnin okunmasını sağlıyor */
.perde{
  position:fixed;inset:0;
  z-index:1;
  pointer-events:none;
  background:rgba(10,10,10,var(--fon-perde));
}

@media (max-width:640px){
  .sutun:nth-child(3){display:none}
}

/* ---------- İçerik ---------- */
.kakemono{width:100%;max-width:430px;position:relative;z-index:2}

.tepe{display:flex;flex-direction:column;align-items:flex-start}

h1{
  font-family:"Fraunces",Georgia,serif;
  font-weight:600;
  font-size:clamp(2.6rem,11vw,3.4rem);
  line-height:.95;
  letter-spacing:-.02em;
  font-variation-settings:"SOFT" 40,"WONK" 1;
  opacity:0;
  animation:satirIn .6s ease-out forwards;
}

/* ---------- Kablo ---------- */
.baglantilar{
  list-style:none;
  margin-top:2.75rem;
  padding-left:1.5rem;
  position:relative;
}

.baglantilar::before{
  content:"";
  position:absolute;
  left:4px;top:.15rem;bottom:1.9rem;
  width:1px;
  background:linear-gradient(var(--kirmizi),rgba(232,51,44,.18));
  transform:scaleY(0);
  transform-origin:top;
  animation:kabloIn 1.15s cubic-bezier(.25,.8,.3,1) .25s forwards;
}

.baglantilar li{
  position:relative;
  opacity:0;
  transform:translateY(6px);
  animation:satirIn .5s ease-out forwards;
}

.baglantilar>li:nth-child(1){animation-delay:.42s}
.baglantilar>li:nth-child(2){animation-delay:.56s}
.baglantilar>li:nth-child(3){animation-delay:.70s}
.baglantilar>li:nth-child(4){animation-delay:.84s}

/* Alt satırlar kapalı başlıyor, ayrıca belirmelerine gerek yok */
.altlar li{opacity:1;transform:none;animation:none}

.baglantilar>li::before{
  content:"";
  position:absolute;
  left:-1.5rem;top:1.55rem;
  width:9px;height:9px;
  border-radius:50%;
  background:var(--siyah);
  border:1px solid var(--kirmizi);
  transition:background .18s ease;
}

.baglantilar>li:hover::before,
.baglantilar>li:focus-within::before{background:var(--kirmizi)}

/* ---------- Link satırı ---------- */
a.satir{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:1rem;
  padding:1.05rem 0;
  border-bottom:1px solid rgba(255,255,255,.13);
  color:var(--beyaz);
  text-decoration:none;
}

.baglantilar>li:first-child>a.satir,
.baglantilar>li:first-child>.satir-sarmal{border-top:1px solid rgba(255,255,255,.13)}

a.satir:hover .ad,
a.satir:focus-visible .ad{color:var(--kirmizi)}

a.satir:focus-visible{
  outline:2px solid var(--kirmizi);
  outline-offset:4px;
  border-radius:2px;
}

/* ---------- Alt satırlar ---------- */
.altlar{list-style:none;padding-left:1.6rem}

.altlar li::before{
  content:"";
  position:absolute;
  left:-1.1rem;top:1.15rem;
  width:5px;height:5px;
  border-radius:50%;
  background:var(--siyah);
  border:1px solid rgba(232,51,44,.55);
  transition:background .18s ease;
}

.altlar li:hover::before,
.altlar li:focus-within::before{background:var(--kirmizi)}

a.alt{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:1rem;
  padding:.75rem 0;
  border-bottom:1px solid rgba(255,255,255,.13);
  color:var(--acikgri);
  font-size:.93rem;
  text-decoration:none;
  transition:color .18s ease;
}

a.alt:hover,a.alt:focus-visible{color:var(--kirmizi)}
a.alt:focus-visible{outline:2px solid var(--kirmizi);outline-offset:4px;border-radius:2px}

/* ---------- Açılır başlık ---------- */
.satir-sarmal{
  display:flex;
  align-items:center;
  gap:.5rem;
  border-bottom:1px solid rgba(255,255,255,.13);
}

.satir-sarmal>a.satir{border-bottom:none;flex:0 1 auto}
.satir-sarmal>.not{margin-left:auto}

button.ac{
  background:none;
  border:0;
  padding:.35rem .25rem;
  cursor:pointer;
  color:var(--acikgri);
  font-size:.85rem;
  line-height:1;
  display:flex;
  align-items:center;
  transition:color .18s ease;
}

button.ac i{transition:transform .25s ease}
button.ac[aria-expanded="true"] i{transform:rotate(180deg)}
button.ac:hover,button.ac:focus-visible{color:var(--kirmizi)}
button.ac:focus-visible{outline:2px solid var(--kirmizi);outline-offset:2px;border-radius:3px}

/* Açılıp kapanan blok — yükseklik otomatik, geçiş yumuşak */
.altlar-sarmal{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .28s ease;
}

li.acik>.altlar-sarmal{grid-template-rows:1fr}
.altlar-sarmal>.altlar{overflow:hidden}

.ad{font-weight:500;transition:color .18s ease;display:flex;align-items:center;gap:.7rem}

.ad i{
  width:1.15em;
  font-size:.95em;
  text-align:center;
  color:var(--acikgri);
  transition:color .18s ease;
  flex-shrink:0;
}

a.satir:hover .ad i,
a.satir:focus-visible .ad i{color:var(--kirmizi)}

/* Font Awesome'da Hugging Face logosu yok, svg gömülü */
.ad svg.hf{
  width:1.15em;
  height:1.05em;
  fill:var(--acikgri);
  flex-shrink:0;
  transition:fill .18s ease;
}

a.satir:hover .ad svg.hf,
a.satir:focus-visible .ad svg.hf{fill:var(--kirmizi)}
.not{color:var(--acikgri);font-size:.83rem;text-align:right;flex-shrink:0}

footer{
  margin-top:2.5rem;
  padding-left:1.5rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  color:var(--acikgri);
  font-size:.8rem;
  opacity:0;
  animation:satirIn .5s ease-out 1.5s forwards;
}

/* ---------- Sağ alttaki sosyal daireler ---------- */
.sosyal{
  display:flex;
  gap:10px;
}

.sosyal a{
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.18);
  border-radius:50%;
  background:rgba(10,10,10,.55);
  color:var(--acikgri);
  font-size:15px;
  text-decoration:none;
  transition:color .18s ease,border-color .18s ease;
}

.sosyal a:hover,
.sosyal a:focus-visible{
  color:var(--kirmizi);
  border-color:var(--kirmizi);
}

.sosyal a:focus-visible{outline:2px solid var(--kirmizi);outline-offset:3px}

@keyframes kabloIn{to{transform:scaleY(1)}}
@keyframes satirIn{to{opacity:1;transform:translateY(0)}}
@keyframes akisYukari{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@keyframes akisAsagi{from{transform:translateY(-50%)}to{transform:translateY(0)}}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  h1,footer,.baglantilar li,.sosyal{opacity:1;transform:none}
  .baglantilar::before{transform:scaleY(1)}
}
</style>
</head>

<script>
document.querySelectorAll("button.ac").forEach(function (dugme) {
  dugme.addEventListener("click", function () {
    var satir = dugme.closest("li");
    var acik = satir.classList.toggle("acik");
    dugme.setAttribute("aria-expanded", acik ? "true" : "false");
    dugme.setAttribute("aria-label", acik ? "Alt bağlantıları kapat" : "Alt bağlantıları aç");
  });
});
